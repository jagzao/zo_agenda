overwrite: true
schema: "http://localhost:3000/api/graphql"
documents: "lib/graphql/**/*.graphql"
generates:
  lib/graphql/generated.ts:
    plugins:
      - "typescript"
      - "typescript-operations"
      - "typescript-react-apollo"
    config:
      withHooks: true
      withComponent: false
      withHOC: false
